[versions]
kotest = "6.2.4"
mschout-conventions = "0.7.1"

[libraries]
kotest-assertions-core = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
kotest-runner-junit5 = { module = "io.kotest:kotest-runner-junit5", version.ref = "kotest" }

[plugins]
mschout-all-conventions = { id = "io.github.mschout.all-conventions", version.ref = "mschout-conventions" }
mschout-maven-publish-conventions = { id = "io.github.mschout.maven-publish-conventions", version.ref = "mschout-conventions" }
